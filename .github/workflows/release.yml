name: Release Vortex CLI Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Test Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile standalone Vortex CLI & Host DLL (Windows x64)
        shell: cmd
        run: |
          if not exist dist mkdir dist
          set VORTEX_VER=1.1.0
          if exist VERSION set /p VORTEX_VER=<VERSION
          for /f "tokens=* delims= " %%a in ("%VORTEX_VER%") do set VORTEX_VER=%%a
          set VORTEX_SRCS=src/arena.c src/lexer.c src/modules.c src/parser_expr.c src/parser_stmt.c src/ir_core.c src/ir_opt.c src/ir_vec_ra.c src/ffi.c src/jit_x64_simd.c src/jit_x64.c src/jit_arm64.c src/debug_info.c src/pkg.c src/lsp.c src/gui.c src/packager.c src/runtime.c src/main.c
          clang -std=c99 -O2 -s -Wall -Wextra -DVORTEX_VERSION=\"%VORTEX_VER%\" %VORTEX_SRCS% -o dist/vortex-windows-x64.exe -luser32 -lgdi32
          clang -std=c99 -O2 -s -shared -DVORTEX_SHARED_LIB -DVORTEX_HEADLESS -Wall -Wextra -DVORTEX_VERSION=\"%VORTEX_VER%\" %VORTEX_SRCS% -o dist/vortex-windows-x64.dll -luser32 -lgdi32
          copy /Y dist\vortex-windows-x64.exe vortex.exe >nul
          .\dist\vortex-windows-x64.exe --version

      - name: Run Vortex test suite (Windows x64)
        shell: cmd
        run: .\tests\run_tests.bat

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vortex-windows-x64
          path: |
            dist/vortex-windows-x64.exe
            dist/vortex-windows-x64.dll

  build-linux:
    name: Build & Test Linux x86-64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & Test Linux x86-64 (CLI + libvortex.so)
        run: |
          chmod +x build.sh tests/*.sh
          sudo apt-get update && sudo apt-get install -y libx11-dev
          make clean && make CC=gcc CFLAGS="-std=c99 -O2 -D_FORTIFY_SOURCE=2 -Wall -Wextra"
          VORTEX_HEADLESS=1 bash ./tests/run_tests.sh
          make clean
          make HEADLESS=1 CC=clang release TARGET=vortex
          make HEADLESS=1 CC=clang shared
          mkdir -p dist
          cp vortex dist/vortex-linux-x64
          cp libvortex.so dist/libvortex-linux-x64.so
          chmod +x dist/vortex-linux-x64
          ./dist/vortex-linux-x64 --version
          VORTEX_HEADLESS=1 bash ./tests/run_tests.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vortex-linux-x64
          path: |
            dist/vortex-linux-x64
            dist/libvortex-linux-x64.so

  build-macos:
    name: Build & Test macOS (ARM64 + x86-64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & Test macOS Apple Silicon (arm64) & Intel (x86_64)
        run: |
          chmod +x build.sh tests/*.sh
          mkdir -p dist

          make clean
          make CC="clang -arch arm64" release TARGET=vortex
          cp vortex dist/vortex-macos-arm64
          chmod +x dist/vortex-macos-arm64
          make CC="clang -arch arm64" shared
          cp libvortex.dylib dist/libvortex-macos-arm64.dylib
          ./dist/vortex-macos-arm64 --version
          VORTEX_HEADLESS=1 bash ./tests/run_tests.sh

          make clean
          make CC="clang -arch x86_64" release TARGET=vortex
          cp vortex dist/vortex-macos-x64
          chmod +x dist/vortex-macos-x64
          file dist/vortex-macos-arm64 dist/vortex-macos-x64

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vortex-macos
          path: |
            dist/vortex-macos-arm64
            dist/libvortex-macos-arm64.dylib
            dist/vortex-macos-x64

  publish-release:
    name: Publish GitHub Release Assets (All Platforms)
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          path: dist_artifacts

      - name: Gather official CLI & shared library executables + SHA256SUMS
        run: |
          mkdir -p release_assets
          cp dist_artifacts/vortex-windows-x64/vortex-windows-x64.exe release_assets/
          cp dist_artifacts/vortex-windows-x64/vortex-windows-x64.dll release_assets/
          cp dist_artifacts/vortex-linux-x64/vortex-linux-x64 release_assets/
          cp dist_artifacts/vortex-linux-x64/libvortex-linux-x64.so release_assets/
          cp dist_artifacts/vortex-macos/vortex-macos-arm64 release_assets/
          cp dist_artifacts/vortex-macos/libvortex-macos-arm64.dylib release_assets/
          cp dist_artifacts/vortex-macos/vortex-macos-x64 release_assets/
          (cd release_assets && sha256sum * > SHA256SUMS.txt)
          ls -lh release_assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release_assets/vortex-windows-x64.exe
            release_assets/vortex-windows-x64.dll
            release_assets/vortex-linux-x64
            release_assets/libvortex-linux-x64.so
            release_assets/vortex-macos-arm64
            release_assets/libvortex-macos-arm64.dylib
            release_assets/vortex-macos-x64
            release_assets/SHA256SUMS.txt
