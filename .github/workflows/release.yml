name: Release Vortex CLI Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Test Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile standalone Vortex CLI (vortex-windows-x64.exe)
        shell: cmd
        run: |
          if not exist releases\v1.0.0 mkdir releases\v1.0.0
          set VORTEX_VER=1.0.1
          if exist VERSION set /p VORTEX_VER=<VERSION
          for /f "tokens=* delims= " %%a in ("%VORTEX_VER%") do set VORTEX_VER=%%a
          clang -std=c99 -Oz -s -flto -ffunction-sections -fdata-sections -Wl,--gc-sections -Wall -Wextra -DVORTEX_VERSION=\"%VORTEX_VER%\" src/arena.c src/lexer.c src/modules.c src/parser_expr.c src/parser_stmt.c src/ir_opt.c src/jit_x64.c src/jit_arm64.c src/debug_info.c src/pkg.c src/lsp.c src/runtime.c src/main.c -o releases/v1.0.0/vortex-windows-x64.exe -luser32 -lgdi32
          copy /Y releases\v1.0.0\vortex-windows-x64.exe vortex.exe >nul
          .\releases\v1.0.0\vortex-windows-x64.exe --version

      - name: Run Vortex test suite
        shell: cmd
        run: .\tests\run_tests.bat

      - name: Upload Windows binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: vortex-windows-x64
          path: releases/v1.0.0/vortex-windows-x64.exe

  build-linux:
    name: Build & Test Linux x86-64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify GCC _FORTIFY_SOURCE & X11 build, then compile portable headless release binary
        run: |
          sudo apt-get update && sudo apt-get install -y libx11-dev
          make clean && make CC=gcc CFLAGS="-std=c99 -O2 -D_FORTIFY_SOURCE=2 -Wall -Wextra"
          VORTEX_HEADLESS=1 ./tests/run_tests.sh
          make clean && make CC=clang
          ./vortex --headless --version
          make clean
          make HEADLESS=1 CC=clang release TARGET=vortex
          mkdir -p releases/v1.0.0
          cp vortex releases/v1.0.0/vortex-linux-x64
          chmod +x releases/v1.0.0/vortex-linux-x64
          ./releases/v1.0.0/vortex-linux-x64 --version

      - name: Run Vortex test suite (Linux x86-64)
        run: |
          cp releases/v1.0.0/vortex-linux-x64 ./vortex
          VORTEX_HEADLESS=1 ./tests/run_tests.sh

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: vortex-linux-x64
          path: releases/v1.0.0/vortex-linux-x64

  build-macos:
    name: Build & Test macOS x86-64
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile standalone Vortex CLI (vortex-macos-x64)
        run: |
          make clean
          make CC="clang -arch x86_64" release TARGET=vortex
          mkdir -p releases/v1.0.0
          cp vortex releases/v1.0.0/vortex-macos-x64
          chmod +x releases/v1.0.0/vortex-macos-x64
          file releases/v1.0.0/vortex-macos-x64
          if arch -x86_64 ./releases/v1.0.0/vortex-macos-x64 --version 2>/dev/null; then
            echo "Rosetta x86_64 execution verified"
          fi

      - name: Run Vortex test suite (macOS host verification)
        run: |
          make clean
          make CC=clang TARGET=vortex
          VORTEX_HEADLESS=1 ./tests/run_tests.sh

      - name: Upload macOS binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: vortex-macos-x64
          path: releases/v1.0.0/vortex-macos-x64

  publish-release:
    name: Publish GitHub Release Assets (CLI Only)
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          path: dist_artifacts

      - name: Gather official CLI executables
        run: |
          mkdir -p release_assets
          cp dist_artifacts/vortex-windows-x64/vortex-windows-x64.exe release_assets/
          cp dist_artifacts/vortex-linux-x64/vortex-linux-x64 release_assets/
          cp dist_artifacts/vortex-macos-x64/vortex-macos-x64 release_assets/
          ls -lh release_assets/

      - name: Attach CLI binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/vortex-windows-x64.exe
            release_assets/vortex-linux-x64
            release_assets/vortex-macos-x64
