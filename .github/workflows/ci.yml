name: CI (Build & Test)

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  test-windows:
    name: Windows x64 (Clang)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Vortex (Clang -std=c99 -Wall -Wextra)
        shell: cmd
        run: .\build.bat

      - name: Run full test suite (Windows)
        shell: cmd
        run: .\tests\run_tests.bat

  test-linux:
    name: Linux x86-64 (GCC + Clang)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & Test with GCC (-D_FORTIFY_SOURCE=2)
        run: |
          chmod +x build.sh tests/*.sh
          sudo apt-get update && sudo apt-get install -y libx11-dev
          make clean && make CC=gcc CFLAGS="-std=c99 -O2 -fno-omit-frame-pointer -D_FORTIFY_SOURCE=2 -Wall -Wextra"
          VORTEX_HEADLESS=1 bash ./tests/run_tests.sh

      - name: Build & Test with Clang + Shared Library
        run: |
          make clean && make CC=clang && make CC=clang shared
          VORTEX_HEADLESS=1 bash ./tests/run_tests.sh

  test-macos:
    name: macOS (Clang)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & Test with Clang (macOS ARM64 + Shared Library)
        run: |
          chmod +x build.sh tests/*.sh
          make clean && make CC=clang TARGET=vortex && make CC=clang shared
          VORTEX_HEADLESS=1 bash ./tests/run_tests.sh
